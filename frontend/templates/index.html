<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Naza AI Trip Planner</title>
  <style>
    :root { --navy:#102a43; --blue:#2563eb; --sky:#eaf4ff; --ink:#243b53; --muted:#627d98; --white:#fff; --green:#0f9d76; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Inter,system-ui,-apple-system,sans-serif; color:var(--ink); background:#f5f8fb; }
    header { color:#fff; background:linear-gradient(120deg,#102a43,#2563eb); padding:30px 5vw 54px; }
    header p { margin:7px 0 0; opacity:.82; }
    main { max-width:1180px; margin:-28px auto 50px; padding:0 22px; }
    .hero,.card { background:var(--white); border-radius:16px; box-shadow:0 10px 28px rgba(16,42,67,.09); }
    .hero { padding:24px; display:flex; justify-content:space-between; gap:20px; align-items:center; }
    .hero h2 { margin:0 0 8px; }
    .badge { padding:8px 12px; border-radius:999px; color:var(--green); background:#e5f8f2; font-weight:700; white-space:nowrap; }
    .grid { display:grid; grid-template-columns:1.2fr .8fr; gap:20px; margin-top:20px; }
    .card { padding:22px; }
    h3 { margin:0 0 16px; color:var(--navy); }
    .weather { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
    .weather div { background:var(--sky); padding:14px; border-radius:12px; }
    .item { border-left:4px solid var(--blue); padding:4px 0 4px 14px; margin:15px 0; }
    .item strong { display:block; }
    small,.muted { color:var(--muted); }
    .activity-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; }
    .activity { padding:14px; border:1px solid #d9e2ec; border-radius:12px; }
    .activity span { color:var(--blue); font-size:12px; font-weight:700; text-transform:uppercase; }
    .empty { color:var(--muted); padding:12px 0; }
    @media(max-width:760px){ .grid,.activity-grid{grid-template-columns:1fr}.hero{align-items:flex-start;flex-direction:column}.weather{grid-template-columns:1fr} }
  </style>
</head>
<body>
  <header><h1>Naza AI Trip Planner</h1><p>Weather-aware itineraries powered by Spark, Lakebase, semantic retrieval, and an AI agent.</p></header>
  <main>
    <section class="hero"><div><h2 id="trip-name">Loading trip…</h2><div class="muted" id="trip-meta"></div></div><div class="badge">Live Lakebase data</div></section>
    <div class="grid">
      <section class="card"><h3>Itinerary</h3><div id="itinerary"></div></section>
      <section class="card"><h3>Weather outlook</h3><div class="weather" id="weather"></div><h3 style="margin-top:24px">Packing list</h3><div id="packing"></div></section>
    </div>
    <section class="card" style="margin-top:20px"><h3>Semantically searchable activities</h3><div class="activity-grid" id="activities"></div></section>
  </main>
  <script>
    const fmt = value => new Date(value).toLocaleString([], {dateStyle:'medium',timeStyle:'short'});
    fetch('./api/dashboard').then(r => r.json()).then(data => {
      if(data.error) throw new Error(data.error);
      document.querySelector('#trip-name').textContent=data.trip.name;
      document.querySelector('#trip-meta').textContent=`${data.trip.destination_name} · ${data.trip.start_date} to ${data.trip.end_date}`;
      document.querySelector('#itinerary').innerHTML=data.itinerary.length?data.itinerary.map(x=>`<div class="item"><strong>${x.name}</strong><small>${fmt(x.scheduled_at)} · ${x.duration_minutes} min · ${x.indoor?'Indoor':'Outdoor'}</small><div>${x.rationale||''}</div></div>`).join(''):'<div class="empty">Ask the agent to add an itinerary item.</div>';
      document.querySelector('#weather').innerHTML=data.weather.slice(0,3).map(x=>`<div><strong>${Number(x.temperature_c).toFixed(1)}°C</strong><br><small>${fmt(x.forecast_time)}<br>Rain ${x.precipitation_probability??0}%</small></div>`).join('')||'<div class="empty">Run the Spark pipeline.</div>';
      document.querySelector('#packing').innerHTML=data.packing.length?data.packing.map(x=>`<div class="item"><strong>${x.item_name}</strong><small>${x.reason}</small></div>`).join(''):'<div class="empty">Ask the agent to generate the list.</div>';
      document.querySelector('#activities').innerHTML=data.activities.map(x=>`<div class="activity"><span>${x.category} · ${x.indoor?'Indoor':'Outdoor'}</span><strong>${x.name}</strong><p>${x.description}</p></div>`).join('');
    }).catch(error => { document.querySelector('main').innerHTML=`<section class="card"><h3>Setup required</h3><p>${error.message}</p></section>`; });
  </script>
</body>
</html>
